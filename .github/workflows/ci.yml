name: CI

# Runs on every push / pull request:
#   1. the full unittest suite (198 tests, real data included),
#   2. the 30 upstream paper photographs through the whole pipeline,
#   3. an accuracy gate that fails the build if any automatically accepted
#      sample is outside the 1.5 % area tolerance, or if automation collapses
#      (too many samples routed to review).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests + accuracy gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Cache upstream test photographs
        uses: actions/cache@v4
        with:
          path: data/paper/images
          key: paper-images-${{ hashFiles('tools/fetch_paper_data.py') }}

      - name: Fetch upstream test photographs (LeafByte, GPL-3.0)
        run: python tools/fetch_paper_data.py

      - name: Unit and integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -t . -v

      - name: Measure the 30 upstream paper photographs
        env:
          PYTHONPATH: src
        run: python -m leafbyte run data/paper/images --out out/paper --scale-cm 17 --overlays review

      - name: Accuracy gate (no wrong auto-accepts, automation still works)
        env:
          PYTHONPATH: src
        run: python tools/ci_check_accuracy.py --run out/paper

      - name: Build the summary table (xlsx + csv)
        env:
          PYTHONPATH: src
        run: python tools/make_summary_table.py --run out/paper --out out/summary

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-py${{ matrix.python-version }}
          path: |
            out/paper/results.csv
            out/paper/results.jsonl
            out/paper/leaf_traits.csv
            out/paper/run.json
            out/summary/叶片性状汇总.csv
            out/summary/叶片性状汇总.xlsx
          if-no-files-found: warn
